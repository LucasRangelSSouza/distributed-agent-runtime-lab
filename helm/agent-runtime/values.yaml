image:
  repository: distributed-agent-runtime-lab-runtime
  tag: latest
  pullPolicy: IfNotPresent

redis:
  image: redis:7-alpine
  storage: 1Gi

gateway:
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  averageCpuUtilization: 70
  keda:
    enabled: false
    stream: runtime-lab:agent-runs
    consumerGroup: agent-workers
    pendingEntriesCount: "5"

networkPolicy:
  enabled: true

secrets:
  existingSecret: ""
