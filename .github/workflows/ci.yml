name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public_demo_policy.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - run: docker build --tag runtime-lab-ci .
      - run: docker run --rm -v "$PWD:/work:ro" alpine/helm:3.16.4 lint /work/helm/agent-runtime
      - run: docker run --rm -v "$PWD:/work:ro" alpine/helm:3.16.4 template runtime-lab /work/helm/agent-runtime | docker run -i --rm ghcr.io/yannh/kubeconform:latest -strict -summary
      - run: docker run --rm -v "$PWD:/work:ro" ghcr.io/yannh/kubeconform:latest -strict -summary /work/k8s/local-kind.yaml /work/k8s/runtime.yaml
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform/gcp-multicluster init -backend=false
      - run: terraform -chdir=infra/terraform/gcp-multicluster fmt -check
      - run: terraform -chdir=infra/terraform/gcp-multicluster validate
      - run: terraform -chdir=infra/terraform/aws-multicluster init -backend=false
      - run: terraform -chdir=infra/terraform/aws-multicluster fmt -check
      - run: terraform -chdir=infra/terraform/aws-multicluster validate
      - name: Reject public-context and credential markers
        run: |
          ! rg -n -i "mindlab|mente inovadora|mi-prd|bigquery|kaggle.{0,40}(token|api|username)|ghp_|AKIA" \
            --glob '!frontend/node_modules/**' --glob '!*.pyc' .
