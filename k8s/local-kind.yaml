apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-redis
spec:
  replicas: 1
  selector: { matchLabels: { app: runtime-redis } }
  template:
    metadata: { labels: { app: runtime-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 2, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: runtime-redis }
spec:
  selector: { app: runtime-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-runtime } }
  template:
    metadata: { labels: { app: agent-runtime, runtime_role: gateway } }
    spec:
      containers:
        - name: runtime
          image: distributed-agent-runtime-lab-runtime:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env: [{ name: REDIS_URL, value: redis://runtime-redis:6379/0 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 6, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: agent-runtime }
spec:
  selector: { app: agent-runtime }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-workers }
spec:
  replicas: 2
  selector: { matchLabels: { app: agent-worker } }
  template:
    metadata: { labels: { app: agent-worker, runtime_role: worker } }
    spec:
      containers:
        - name: worker
          image: distributed-agent-runtime-lab-runtime:latest
          imagePullPolicy: Never
          command: ["python", "-m", "runtime_lab.worker"]
          env: [{ name: REDIS_URL, value: redis://runtime-redis:6379/0 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
