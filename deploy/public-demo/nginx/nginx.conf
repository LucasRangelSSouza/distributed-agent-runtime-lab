# Public-demo edge. The only published container. Runs as the unprivileged
# nginx user from nginxinc/nginx-unprivileged and listens on 8080/8443 inside
# the container; Compose publishes them as host ports 80/443.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Log policy: method, path without query string, status, size, and timing.
    # Never log request bodies, query strings, cookies, Authorization headers,
    # or client addresses.
    log_format public_demo '$time_iso8601 $request_method "$uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout public_demo;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_timeout 10s;
    client_body_timeout 10s;

    limit_req_zone $binary_remote_addr zone=public_edge:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=public_write:10m rate=2r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
