# Egress proxy for the public-demo profile. It is the only container attached
# to the outbound network. Application containers reach it on the internal
# "egress" network and have no direct route out.
#
# Policy: deny by default. Allow only destinations listed in allowed_domains,
# only on ports 80/443, and never when the destination resolves to loopback,
# private, carrier-grade NAT, link-local, or cloud metadata addresses.
#
# Local profile allowlist: example.com is a fixture destination used only to
# prove that the proxy path works. A real provider policy replaces it after
# the provider is chosen (see compatibility-matrix.md).

http_port 3128

acl allowed_domains dstdomain example.com

acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst ::1/128 fc00::/7 fe80::/10
acl metadata_names dstdomain metadata.google.internal metadata instance-data

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_localhost
http_access deny blocked_dst
http_access deny metadata_names
http_access allow allowed_domains
http_access deny all

# No caching, no disk state, no forwarded client identity.
cache deny all
cache_mem 8 MB
forwarded_for delete
via off
httpd_suppress_version_string on
reply_header_access Server deny all

# Non-root runtime: everything writable lives on tmpfs.
pid_filename /run/squid/squid.pid
coredump_dir /tmp
cache_log stdio:/dev/stderr
# Access log keeps method, destination host, status. strip_query_terms is on.
logformat public_demo %ts %>Hs %rm %>rd %Ss
access_log stdio:/dev/stdout public_demo
strip_query_terms on
shutdown_lifetime 1 seconds
# ICMP needs a raw socket capability that this container does not have.
pinger_enable off
# Docker grants a very high fd limit; squid sizes tables from it.
max_filedescriptors 1024
